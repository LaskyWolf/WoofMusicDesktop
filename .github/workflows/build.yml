name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # attach builds to the GitHub release on tags

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            bundle: build/linux/x64/release/bundle
          - os: windows-latest
            platform: windows
            bundle: build/windows/x64/runner/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ${{ matrix.platform }} --release

      - name: Pack
        shell: bash
        run: |
          name="WoofMusicDesktop-${{ matrix.platform }}-x64"
          if [ "${{ matrix.platform }}" = linux ]; then
            tar -czf "$name.tar.gz" -C "${{ matrix.bundle }}" .
          else
            7z a "$name.zip" "./${{ matrix.bundle }}/*"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WoofMusicDesktop-${{ matrix.platform }}
          path: WoofMusicDesktop-*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WoofMusicDesktop-*
