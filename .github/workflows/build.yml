name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # a v* tag uploads the packages to its release
    steps:
      - uses: actions/checkout@v4
      # libmpv 2.0 (mpv 0.35) or newer: Ubuntu 24.04 ships 0.37.
      # WebKitGTK and GTK: the sign-in window. D-Bus: tao.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install libmpv
        if: runner.os == 'Windows'
        run: ./packaging/windows/libmpv.ps1
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Packages, on v* tags only.
      - name: Build release binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release -p woofmusic
      - name: AppImage
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: packaging/linux/appimage.sh
      - name: Installer
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$("${{ github.ref_name }}".TrimStart('v'))" packaging\windows\woofmusic.iss
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            WoofMusic-x86_64.AppImage
            target/installer/*.exe
          fail_on_unmatched_files: false
