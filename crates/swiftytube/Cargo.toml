[package]
name = "swiftytube"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22.1"
keyring = "4.2.0"
keyring-core = "1.0.1"
log = "0.4.35"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["gzip"] }
rquickjs = { version = "0.14", features = ["parallel"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
