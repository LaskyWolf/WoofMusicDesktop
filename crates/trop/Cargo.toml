[package]
name = "trop"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22.1"
fastrand = "2"
flate2 = "1.1.11"
form_urlencoded = "1.2.2"
jiff = "0.2.46"
libmpv2 = { version = "7", default-features = false }
log = "0.4.35"
md-5 = "0.11.0"
pinyin = { version = "0.11.0", default-features = false, features = ["with_tone"] }
regex = "1.13.1"
reqwest = "0.13.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
serde_json = "1.0.154"
swiftytube = { path = "../swiftytube" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
keyring-core = "1.0.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
