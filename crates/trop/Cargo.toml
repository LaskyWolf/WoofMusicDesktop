[package]
name = "trop"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22.1"
flate2 = "1.1.11"
libmpv2 = { version = "7", default-features = false }
log = "0.4.35"
regex = "1.13.1"
reqwest = "0.13.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
swiftytube = { path = "../swiftytube" }
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
