[package]
name = "trop"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
libmpv2 = { version = "7", default-features = false }
log = "0.4.35"
pinyin = { version = "0.11.0", default-features = false, features = ["with_tone"] }
regex = "1.13.1"
reqwest = "0.13.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
swiftytube = { path = "../swiftytube" }
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
